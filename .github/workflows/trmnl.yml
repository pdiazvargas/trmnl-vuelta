name: TRMNL
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - run: gem install trmnl_preview
      - run: trmnlp lint

  push:
    needs: lint
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - run: gem install trmnl_preview
      # --id targets the existing "Vuelta a España Stages" plugin (414982).
      # Without it, trmnlp push creates a brand-new orphaned plugin on every run.
      - run: trmnlp push --force --id 414982
        env:
          TRMNL_API_KEY: ${{ secrets.TRMNL_API_KEY }}
